[workspace]
resolver = "3"
members = ["crates/crossbow-proto", "crates/crossbow-core", "crates/crossbow-engine", "crates/crossbow-ai", "app", "xtask"]
# The Cloudflare Worker builds for wasm32 with its own lockfile.
exclude = ["cloud"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agentik-os/crossbow-browser"

[profile.release]
lto = "thin"
codegen-units = 4
