[package]
name = "crossbow-api"
description = "Crossbow public API Worker: auth, devices, sync, WebSocket fan-out and the /v1/ai proxy."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32 by worker-build; not a member of the root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crossbow-proto = { path = "../../crates/crossbow-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
base64 = "0.22.1"

# Everything that touches the Workers runtime only exists on wasm32, so the pure
# logic modules build and test natively with `cargo test`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
getrandom = { version = "0.2.17", features = ["js"] }
# The #[durable_object] macro expands to code that names `wasm_bindgen` directly.
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
