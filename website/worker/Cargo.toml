[package]
name = "crossbow-site"
description = "Crossbow landing assets and a separately gated Clerk waitlist."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# This Worker is independent of both the desktop workspace and cloud/api.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
